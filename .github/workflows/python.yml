name: Python Tests

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
    - name: Install ProgressiVis
      run: |
        python -m pip install .[test]
    - name: Run tests
      run: |
        coverage run -m pytest --durations=50 tests -vv

    - name: Coverage
      run: |
        coverage html

    - name: Upload coverage
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report-${{ matrix.python }}
        path: htmlcov

    - name: Pip freeze
      if: failure()
      run: |
        mkdir -p downloads/${{ matrix.python }}/
        python -m pip freeze > downloads/${{ matrix.python }}/pip_freeze.txt
    - name: Upload frozen env
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: pip-freeze-${{ matrix.python }}
        path: downloads

  free-threaded:
    # CPython 3.14t (no GIL) with the parallel scheduler
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.14t
      uses: actions/setup-python@v6
      with:
        python-version: "3.14t"
    - name: Install ProgressiVis
      run: |
        python -m pip install .[test]
    - name: No new module re-enables the GIL
      run: |
        python scripts/check_free_threading.py
    - name: Run tests without the GIL, 4 scheduler workers
      env:
        PYTHON_GIL: "0"
        PROGRESSIVIS_WORKERS: "4"
      run: |
        python -c "import sys, progressivis; assert not sys._is_gil_enabled()"
        python -m pytest --durations=20 -m '' tests
